<span class="token-picker-field-box" *ngIf="!isDynamic else dynamic">

  <mat-form-field *ngIf="showTokenTextBox" title="{{lf_field_info.displayName}}" appearance="outline" class="lf-field">
    <input #tokenTarget matInput type="text" [formControl]="lf_field_form_control"
      title="{{lf_field_form_control.value}}" (change)="onTimeValueChangedAsync()">
  </mat-form-field>
  <uni-date-time #tokenTarget class="lf-field" *ngIf="!showTokenTextBox" [config]="uniDateTimeConfig"
    [settings]="uniDateTimeSettings" (onValueChangedEvent)="onUniDateOrTimeChanged($event)">
  </uni-date-time>
  <lf-token-picker-component class="lf-field-token-picker" (tokenPicked)="onTimeTokenChosen($event)"
    [data]="lfFieldTokenData">
  </lf-token-picker-component>
</span>
<mat-error *ngIf="getBrokenValidationRule()">{{fieldValidationErrorMsg | async}}</mat-error>

<ng-template #dynamic>
  <lf-dynamic-field-component ngDefaultControl [options]="dynamic_field_value_options"
    [formControl]="lf_field_form_control" [title]="lf_field_info.displayName"
    [fieldValidationErrorMsg]="fieldValidationErrorMsg" [getBrokenValidationRule]="getBrokenValidationRule.bind(this)"
    (valueChange)="onValueChanged()">
  </lf-dynamic-field-component>
</ng-template>
