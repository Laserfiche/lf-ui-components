@if (!isDynamic) {
  <span class="token-picker-field-box" [ngClass]="{'extra-space': !getBrokenValidationRule()}">
    @if (showTokenTextBox) {
      <mat-form-field title="{{lf_field_info.displayName}}" appearance="outline"
        class="lf-field lf-date-field">
        <input #tokenTarget matInput [formControl]="lf_field_form_control" title="{{lf_field_form_control.value}}"
          (change)="onDateOrTimeTokenValueChanged()">
      </mat-form-field>
    }
    @if (!showTokenTextBox) {
      <lf-uni-date-time #tokenTarget class="lf-field" [config]="uniDateTimeConfig"
        [settings]="uniDateTimeSettings" (valueChangedEventHandler)="onUniDateOrTimeChanged($event)">
      </lf-uni-date-time>
    }
    <lf-token-picker-component class="lf-field-token-picker" (tokenPicked)="onTokenChosen($event)"
    [data]="lfFieldTokenData"></lf-token-picker-component>
  </span>
} @else {
  <lf-dynamic-field-component ngDefaultControl [options]="dynamic_field_value_options"
    [formControl]="lf_field_form_control" [title]="lf_field_info.displayName"
    [fieldValidationErrorMsg]="fieldValidationErrorMsg" [getBrokenValidationRule]="getBrokenValidationRule.bind(this)"
    (valueChange)="onValueChanged()" [compareWith]="compareDateStrings">
  </lf-dynamic-field-component>
}
@if (getBrokenValidationRule()) {
  <mat-error>{{fieldValidationErrorMsg | async}}</mat-error>
}
